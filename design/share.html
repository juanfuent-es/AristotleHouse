<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Aristotle House — social image · 1280 × 640</title>
<style>
  @font-face {
    font-family: "Zalando Sans Expanded";
    src: url("../public/fonts/zalando-sans-expanded-latin-wght-normal.woff2") format("woff2");
    font-weight: 200 900;
  }
  @font-face {
    font-family: Inter;
    src: url("../public/fonts/inter-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: #0B0A0F; color: #F2EFE8; font-family: Inter, sans-serif; }
  .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  main { position: relative; width: 100%; height: 100%; padding: 32px 48px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .lockup { width: 360px; height: auto; }
  p { margin: 0; font-size: 13px; line-height: 1.5; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
  .right { text-align: right; }
  .soft { color: #C9C4D4; }
  h1 {
    position: absolute; left: 48px; right: 48px; bottom: 72px; margin: 0;
    font-family: "Zalando Sans Expanded", sans-serif;
    font-size: 112px; font-weight: 800; line-height: 1; letter-spacing: -.012em;
    text-align: center; white-space: nowrap;
    color: #F2EFE8;
    background: linear-gradient(165deg, #F2EFE8 8%, #C7B8FF 35%, #8B76DE 52%, #F2EFE8 70%, #C7B8FF 85%);
    background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 -1px 0 #F2EFE8) drop-shadow(0 3px 0 #6B54B1) drop-shadow(0 5px 0 #3D286F);
  }
</style>
<body>
  <img class="poster" src="../public/brand/poster.webp" alt="">
  <main>
    <header>
      <img class="lockup" src="../public/brand/lockup-light.svg" alt="Aristotle House">
      <p class="right">Experiential agency<br><span class="soft">Dubai, UAE</span></p>
    </header>
    <h1>COMING SOON</h1>
  </main>
</body>
</html>
